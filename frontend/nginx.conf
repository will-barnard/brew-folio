server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx drops server-level add_header in any location that sets its own, so
  # the security headers live in a snippet included where pages are served.
  # Backend via Docker DNS, resolved per request: a static upstream crashes
  # nginx at start if the backend isn't up yet, and ipv6=off avoids SERVFAIL
  # on AAAA lookups from Docker's embedded DNS.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Statement PDFs / receipt photos — stream through, don't spool.
    client_max_body_size 64m;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    add_header Cache-Control "no-store" always;
  }

  # Beachhead health check — proxied so a dead backend fails the deploy.
  location = /healthz {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
  }

  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
